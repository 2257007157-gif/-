name: TCL-Taobao-Public-Live-Page-Identity-Check
on:
  push:
    branches: [tcl-network-diagnostic]
    paths: ['.github/workflows/tcl-taobao-public-live-page-identity-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Compare TCL ID and negative control
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const accounts=[{label:'historically-linked-TCL-userId',id:'2050532947'},{label:'negative-control-nonexisting-userId',id:'999999999999999'}];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'zh-CN',userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/125.0.0.0 Mobile Safari/537.36'});
          const clean=url=>{try{const u=new URL(url);return u.protocol+'//'+u.hostname+u.pathname;}catch{return '';}};
          const publicIds=url=>{try{const out={};for(const [key,value] of new URL(url).searchParams)if(/^(userId|liveId|roomId|id|accountId)$/i.test(key)&&/^\d{4,24}$/.test(value))out[key]=value;return out;}catch{return {}}};
          const redact=text=>text.replace(/1[3-9]\d{9}/g,'[phone]').replace(/[A-Za-z0-9_-]{80,}/g,'[token]').slice(0,2000);
          const output={test:'public Taobao live page comparison; no credentials; not a stream availability assertion',time:new Date().toISOString(),statusVerified:false,results:[]};
          for(const a of accounts){
            const url='https://h5.m.taobao.com/taolive/video.html?userId='+a.id;
            const page=await context.newPage();
            const network=[],requests=[];
            page.on('response',response=>{
              try {const u=new URL(response.url());if(!/(^|\.)(taobao\.com|tmall\.com|alicdn\.com|tb\.cn)$/i.test(u.hostname))return;
                const info={url:clean(response.url()),status:response.status(),type:(response.headers()['content-type']||'').split(';')[0]};
                if(!network.some(x=>x.url===info.url&&x.status===info.status))network.push(info);
              }catch{}
            });
            const result={label:a.label,id:a.id};
            try {
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(6500);
              const dom=await page.evaluate(()=>{
                const t=document.body?.innerText||'';
                const selectors=[...document.querySelectorAll('a[href]')].map(a=>({text:(a.innerText||a.getAttribute('title')||'').slice(0,40),href:a.href})).filter(x=>/直播|主页|回放|live|shop|TCL/.test(x.text+' '+x.href)).slice(0,20);
                return {title:document.title,text:t,links:selectors};
              });
              result.http=response?.status();result.finalPage=clean(page.url());result.finalIds=publicIds(page.url());result.title=dom.title;
              result.visibleText=redact(dom.text);result.visibleLength=dom.text.length;
              result.signals={tclNameVisible:dom.text.includes('TCL集团官方旗舰店'),containsLiveText:dom.text.includes('直播中')||dom.text.includes('正在直播'),containsEnded:dom.text.includes('直播结束')||dom.text.includes('已结束')||dom.text.includes('主播不在'),containsPlayback:dom.text.includes('回放'),loginRequired:dom.text.includes('登录')&&dom.text.includes('密码')};
              result.relevantLinks=dom.links.map(x=>({text:x.text,url:clean(x.href),publicIds:publicIds(x.href)}));
              result.networkEndpoints=network.slice(0,35);
            }catch(e){result.error=String(e?.message||e).slice(0,210);}
            output.results.push(result);
            await page.close();
          }
          await browser.close();
          console.log(JSON.stringify(output,null,2));
          await fs.writeFile('tcl-public-live-page-identity.json',JSON.stringify(output,null,2)+'\n');
          JS
      - name: Upload identity comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-public-live-page-identity
          path: tcl-public-live-page-identity.json
          retention-days: 7
          if-no-files-found: warn
