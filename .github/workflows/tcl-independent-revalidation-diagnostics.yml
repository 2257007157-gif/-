name: TCL-Taobao-Independent-Revalidation-Diagnostics
on:
  push:
    branches: [tcl-network-diagnostic]
    paths: ['.github/workflows/tcl-independent-revalidation-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout and install browser
        uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Compare normal page with negative-control ID
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const ctx=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'zh-CN',userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36'});
          function parse(t){
            try{return JSON.parse(t)}catch{}
            const i=t.indexOf('('),j=t.lastIndexOf(')');
            if(i<1||j<=i||!(/^[\w$.]{1,64}$/).test(t.slice(0,i).trim()))throw Error('Unrecognized JSONP');
            return JSON.parse(t.slice(i+1,j));
          }
          function narrow(v){
            if(v===null||v===undefined)return null;
            const s=String(v);
            if(s.length>150)return '[too-long]';
            if(/https?:\/\//.test(s))return '[url-omitted]';
            return s;
          }
          const out={mode:'guest Chromium fresh runner, independent observed status diagnostic',at:new Date().toISOString(),credentialsSupplied:false,results:[]};
          for(const config of [{label:'TCL-identity',id:'2050532947'},{label:'negative-control',id:'999999999999999'}]){
            const p=await ctx.newPage(),items=[],waiting=[];
            p.on('response',resp=>{
              try{
                const u=new URL(resp.url());if(u.hostname!=='h5api.m.taobao.com'||!u.pathname.includes('mtop.mediaplatform.live.livedetail/4.0'))return;
                waiting.push((async()=>{
                  const item={http:resp.status(),api:u.pathname};
                  try{
                    const data=parse(await resp.text());
                    item.ret=Array.isArray(data?.ret)?data.ret.slice(0,5).map(narrow):narrow(data?.ret);
                    item.rootKeys=Object.keys(data||{}).slice(0,18);
                    item.dataType=typeof data?.data;
                    const x=data?.data??{};
                    const keys=['accountId','roomNum','liveId','roomStatus','streamStatus','status','startTime','endTime','title','userId'];
                    item.dataFields=Object.fromEntries(keys.map(k=>[k,narrow(x[k])]));
                    const bc=x?.broadCaster??{};
                    item.broadCaster=Object.fromEntries(['accountId','accountName','roomNum','roomStatus'].map(k=>[k,narrow(bc[k])]));
                    const fm=x?.featureMap??{};
                    item.featureMap={live_status:narrow(fm.live_status),roomNum:narrow(fm.roomNum)};
                    item.dataKeys=Object.keys(x).slice(0,40);
                  }catch(e){item.error=String(e?.message||e).slice(0,130);}
                  items.push(item);
                })());
              }catch{}
            });
            const row={label:config.label};
            try{
              const r=await p.goto('https://h5.m.taobao.com/taolive/video.html?userId='+config.id,{waitUntil:'domcontentloaded',timeout:25000});
              await p.waitForTimeout(7800);
              row.pageStatus=r?.status();row.title=await p.title();
              const t=(await p.locator('body').innerText()).slice(0,250);
              row.visible={tclName:t.includes('TCL集团官方旗舰店'),hasEnd:t.includes('直播结束'),hasLoading:t.includes('加载中'),roomNum:(t.match(/房间号：\s*(\d+)/)||[])[1]||null,preview:t.replace(/\b1[3-9]\d{9}\b/g,'[redacted]')};
            }catch(e){row.pageError=String(e?.message||e).slice(0,180);}
            await Promise.allSettled(waiting);
            row.apiResponses=items;
            out.results.push(row);await p.close();
          }
          await b.close();
          console.log(JSON.stringify(out,null,2));
          await fs.writeFile('tcl-diagnostic.json',JSON.stringify(out,null,2)+'\n');
          JS
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-diagnostic-revalidation
          path: tcl-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
