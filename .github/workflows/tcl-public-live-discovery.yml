name: TCL-Public-Live-Discovery
on:
  workflow_dispatch:
  push:
    branches: [tcl-network-diagnostic]
    paths:
      - .github/workflows/tcl-public-live-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Inspect public Taobao Live discovery surface
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:1365,height:768},locale:'zh-CN',userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'});
          const targets=[['live-home','https://live.taobao.com/'],['shop','https://shop109942179.taobao.com/']];
          const tidy=u=>{try{const x=new URL(u);return x.origin+x.pathname;}catch{return ''}};
          const out={source:'real public guest Chromium; no credentials',timestamp:new Date().toISOString(),accountIdFound:false,roomIdFound:false,pages:[]};
          for (const [label,target] of targets){
            const page=await context.newPage(),result={label};
            try{
              const resp=await page.goto(target,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForTimeout(4500);
              const dom=await page.evaluate(()=>{
                const text=document.body?.innerText||'';
                return {title:document.title,textSample:text.slice(0,900),textLength:text.length,anchors:[...document.querySelectorAll('a[href]')].slice(0,200).map(a=>({text:(a.innerText||a.getAttribute('title')||'').slice(0,40),href:a.href})),inputs:[...document.querySelectorAll('input')].slice(0,12).map(i=>({type:i.type,placeholder:i.placeholder,outer:i.outerHTML.slice(0,160)}))};
              });
              result.http=resp?.status();result.finalUrl=tidy(page.url());result.title=dom.title;result.textLength=dom.textLength;
              result.textSample=dom.textSample.replace(/\b(?:\+?86)?1[3-9][0-9]{9}\b/g,'[redacted-phone]');
              result.inputs=dom.inputs.map(i=>({type:i.type,placeholder:i.placeholder}));
              result.linkCount=dom.anchors.length;
              result.relevantLinks=dom.anchors.filter(x=>/直播|tcl|主播|live|search|shop/i.test(x.text+' '+x.href)).slice(0,30).map(x=>({text:x.text,url:tidy(x.href)}));
              result.hasTCL=dom.textSample.includes('TCL集团官方旗舰店');
            }catch(e){result.error=String(e.message).slice(0,260);}
            out.pages.push(result);await page.close();
          }
          await browser.close();
          console.log(JSON.stringify(out,null,2));
          await fs.writeFile('tcl-public-live-discovery.json',JSON.stringify(out,null,2)+'\n');
          JS
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-public-live-discovery
          path: tcl-public-live-discovery.json
          retention-days: 7
