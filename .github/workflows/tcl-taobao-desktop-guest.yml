name: TCL-Taobao-Desktop-Guest-Test
on:
  push:
    branches: [tcl-network-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test desktop visitor mode (no login)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const c=await b.newContext({viewport:{width:1365,height:768},locale:'zh-CN',userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'});
          const targets=[['store','https://shop109942179.taobao.com/'],['share','https://m.tb.cn/h.j6PTNeyMVeBrabu'],['live-home','https://live.taobao.com/']];
          const out={test:'desktop Chromium anonymous (no cookies/accounts)',statusVerified:false,targets:[]};
          for(const [label,url] of targets){
            const p=await c.newPage(),r={label};
            try {
              const res=await p.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForTimeout(3500);
              const v=await p.evaluate(()=>{
                const t=document.body?.innerText||'';
                return {title:document.title,bodyLength:t.length,shopName:t.includes('TCL集团官方旗舰店'),liveWord:/直播|LIVE/.test(t),loginWord:/登录|请登录|验证码|安全验证/.test(t),anchors:[...document.querySelectorAll('a[href]')].map(a=>({text:(a.innerText||'').slice(0,24),href:a.href})).filter(a=>/直播|live/i.test(a.text+' '+a.href)).slice(0,10)};
              });
              const strip=x=>{try{const u=new URL(x);return u.origin+u.pathname;}catch{return ''}};
              r.httpStatus=res?.status()??null;r.finalUrl=strip(p.url());r.page={...v,anchors:v.anchors.map(x=>({text:x.text,href:strip(x.href)}))};
            } catch(e){r.error=String(e?.message||e).slice(0,250);}
            out.targets.push(r);await p.close().catch(()=>{});
          }
          await b.close();
          console.log(JSON.stringify(out,null,2));
          await fs.writeFile('desktop-guest-report.json',JSON.stringify(out,null,2)+'\n');
          JS
      - name: Upload guest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-desktop-guest
          path: desktop-guest-report.json
          retention-days: 7
