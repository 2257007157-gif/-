name: TCL-Douyin-Public-Web-Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [tcl-douyin-diagnostic]
    paths:
      - 'scripts/tcl-douyin-public-discovery.mjs'
      - 'config/tcl-douyin-public-discovery.json'
      - '.github/workflows/tcl-douyin-public-discovery.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout independent Douyin test branch
        uses: actions/checkout@v4
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Discover public account or room links without login
        run: node scripts/tcl-douyin-public-discovery.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-douyin-public-discovery
          path: tcl-douyin-public-discovery.json
          retention-days: 7
          if-no-files-found: warn
