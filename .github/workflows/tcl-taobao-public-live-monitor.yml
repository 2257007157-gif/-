name: TCL-Taobao-Public-Live-Monitor-Repeatable-Test
on:
  push:
    branches: [tcl-network-diagnostic]
    paths: ['scripts/tcl-taobao-public-live-monitor.mjs','.github/workflows/tcl-taobao-public-live-monitor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Check TCL real Taobao live status
        run: node scripts/tcl-taobao-public-live-monitor.mjs
      - name: Upload structured status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcl-live-status-proof
          path: tcl-live-status.json
          retention-days: 7
          if-no-files-found: warn
